  #### US-048: check security - test

  **Epic:** EP-010 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come operatore,
  voglio verificare carico e protezione degli URL riservati,
  così da individuare problemi di disponibilità o accesso ai viaggi non pubblici.

  ## Dimostrazione
  Il revisore esamina i risultati dei controlli di carico e dei controlli degli URL di viaggi in bozza. La fonte non definisce soglie di carico o un report allegato; questi dati non sono ricostruiti come risultati.

  ## Criteri di accettazione
  - [ ] AC-1 — La verifica storica comprende controlli di carico; nessuna soglia è indicata nella fonte.
  - [ ] AC-2 — La verifica storica comprende la protezione degli URL non pubblici, inclusi i viaggi in bozza.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
