body: |-
  #### US-051: collegamento viaggio <-> scheda Ranger

  **Epic:** EP-005 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  in qualità di explorer voglio vedere quale ranger ha creato il viaggio affinché possa capire attendibilità del viaggio che vorrei comprare

  ## Dimostrazione
  Un Explorer clicca sul nome del Ranger prima nel dettaglio e poi nella griglia di un viaggio: in entrambi i casi raggiunge la scheda dell’autore.

  ## Criteri di accettazione
  - [ ] AC-1 — Il nome del Ranger nel dettaglio viaggio apre la scheda dell’autore.
  - [ ] AC-2 — Il nome del Ranger nella griglia viaggi apre la scheda dell’autore.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-149](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-149)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  in qualità di explorer voglio vedere quale ranger ha creato il viaggio affinché possa capire attendibilità del viaggio che vorrei comprare

  AC

  nella pagina del viaggio il nome del ranger che ha creato il viaggio mi permette di andare alla scheda del ranger.
  nella visualizzazione griglia dei viaggi, il nome del ranger che ha creato il viaggio mi permette di andare alla scheda del ranger.
