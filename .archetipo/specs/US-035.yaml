  #### US-035: #BUGFIX - info tappa

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come utente che consulta una tappa,
  voglio vedere i waypoint e un comando Scarica GPX chiaro,
  così da usare le informazioni pertinenti alla traccia.

  ## Dimostrazione
  Il revisore apre una tappa con GPX contenente waypoint: vede il conteggio waypoint e il pulsante Scarica GPX, senza dislivello o punti chiave.

  ## Criteri di accettazione
  - [ ] AC-1 — La tappa mostra i waypoint al posto dei punti traccia.
  - [ ] AC-2 — Il pulsante di download è etichettato Scarica GPX.
  - [ ] AC-3 — La tappa non mostra il dislivello nel perimetro della correzione.
  - [ ] AC-4 — La tappa non mostra i punti chiave nel perimetro della correzione.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

