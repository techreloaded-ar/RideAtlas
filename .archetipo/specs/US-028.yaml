body: |-
  #### US-028: visualizza i miei viaggi

  **Epic:** EP-004 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  in qualità di utente rider voglio poter accedere alla sezione i miei viaggi, per vedere quelli che ho comprato

  ## Dimostrazione
  Con un viaggio acquistato e uno non acquistato il revisore apre la dashboard: la sezione I viaggi che hai comprato contiene solo il primo.

  ## Criteri di accettazione
  - [ ] AC-1 — La dashboard dell’utente registrato espone I viaggi che hai comprato.
  - [ ] AC-2 — La sezione mostra esclusivamente i viaggi acquistati dall’utente.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
