body: |-
  #### US-047: Riordinamento viaggi

  **Epic:** EP-003 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  in qualità di admin voglio poter cambiare ordine dei viaggi affinché si possa scegliere ordinamento della presentazione  su /viaggi

  ## Dimostrazione
  Un admin cambia l’ordine di due viaggi dal pannello di controllo e apre /viaggi: vede il nuovo ordine di presentazione.

  ## Criteri di accettazione
  - [ ] AC-1 — L’admin può modificare l’ordine dei viaggi dal pannello di controllo.
  - [ ] AC-2 — La pagina /viaggi presenta i viaggi nell’ordine impostato.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

