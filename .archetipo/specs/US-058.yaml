  ## Storia utente
  Come utente,
  voglio consultare l’EULA di riferimento,
  così da conoscere le condizioni d’uso previste dal documento.

  ## Dimostrazione
  Il revisore apre il collegamento EULA conservato dalla scheda Nifty e confronta la versione del documento disponibile; il contenuto esterno non è incluso nell’estrazione.

  ## Criteri di accettazione
  - [ ] AC-1 — La scheda conserva il collegamento originale al documento EULA; il testo del documento esterno non è stato acquisito.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

