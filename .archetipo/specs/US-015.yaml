  #### US-015: US 4.1.9 Visualizzazione lista viaggi

  **Epic:** EP-003 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Utente base
  Voglio visualizzare l’elenco dei viaggi creati
  Affinché possa consultare le opzioni di itinerario a disposizione

  ## Dimostrazione
  Con un viaggio disponibile il revisore apre l’elenco e legge titolo, descrizione, zona e stagione nella relativa voce.

  ## Criteri di accettazione
  - [ ] AC-1 — Ogni voce dell’elenco mostra il titolo del viaggio.
  - [ ] AC-2 — Ogni voce dell’elenco mostra descrizione, zona e stagione del viaggio.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

