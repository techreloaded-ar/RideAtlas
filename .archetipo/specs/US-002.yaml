  ## Testo originale Nifty
  In qualità di administrator, voglio creare utenti con diversi ruoli affinché possano accedere alla piattaforma in base alle proprie responsabilità.

  Criteri di accettazione

  login per utente admin (admin/admin) con ruolo administrator
  senza Google/Apple login.
  Admin può creare utenti e assegnare ruoli multipli: ranger, administrator, content-producer.
  Ruoli non esclusivi
  ACL basata su ruoli.
  Lista utenti con ruolo visibile.
