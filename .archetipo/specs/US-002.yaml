body: |-
  #### US-002: US 1.0 — CREAZIONE UTENTE E RUOLI (pt 5)

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  In qualità di administrator, voglio creare utenti con diversi ruoli affinché possano accedere alla piattaforma in base alle proprie responsabilità.

  ## Dimostrazione
  Un amministratore apre la gestione utenti, crea un utente con più ruoli e lo cerca nella lista; vede i ruoli assegnati. Accedendo con un ruolo diverso osserva le sole funzioni ammesse.

  ## Criteri di accettazione
  - [ ] AC-1 — Un amministratore può creare utenti.
  - [ ] AC-2 — Un utente può ricevere più ruoli tra ranger, administrator e content-producer.
  - [ ] AC-3 — La lista utenti mostra i ruoli correnti.
  - [ ] AC-4 — I permessi di accesso dipendono dai ruoli assegnati.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

