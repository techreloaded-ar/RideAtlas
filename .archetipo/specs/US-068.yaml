  #### US-068: rimuovere FAQ dal footer

  **Epic:** EP-007 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come responsabile del prodotto,
  voglio rimuovere il collegamento FAQ dal footer,
  così da rinviare la sezione alla release 1.1.

  ## Dimostrazione
  Il revisore apre il footer del sito e verifica che non contenga il link FAQ rinviato alla release successiva.

  ## Criteri di accettazione
  - [ ] AC-1 — Il footer non mostra il collegamento FAQ rinviato alla versione 1.1.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

