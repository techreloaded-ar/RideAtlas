  #### US-017: US 4.6.2 - Caricamento traccia del viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come editor di un viaggio
  Voglio caricare contenuti una traccia al viaggio già creato
  Affinché gli utenti possano scaricare il file e usarlo nel loro sistema

  ## Dimostrazione
  L’editor carica un GPX non compresso su un viaggio esistente, lo scarica e confronta il file ricevuto con l’originale: i contenuti coincidono.

  ## Criteri di accettazione
  - [ ] AC-1 — Un editor può caricare un file GPX non compresso su un viaggio esistente.
  - [ ] AC-2 — Il GPX scaricato conserva il contenuto del file caricato.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

