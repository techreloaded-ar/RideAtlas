  ## Testo originale Nifty
  Come editor di un viaggio
  Voglio caricare contenuti una traccia al viaggio già creato
  Affinché gli utenti possano scaricare il file e usarlo nel loro sistema

  AC:

  utente, partendo da un viaggio già esistente, aggiunge il file  traccia (gpx) in formato non compresso.
  Il file viene salvato nel sistema in modo da non alternarne il contenuto (al download utente riceve il file integro pronto per installazione sul suo Device).
