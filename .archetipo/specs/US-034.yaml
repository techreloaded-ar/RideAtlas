body: |-
  #### US-034: #DEFECT - visualizzazione griglia

  **Epic:** EP-003 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Explorer,
  voglio consultare schede compatte nella griglia viaggi,
  così da leggere le stagioni senza etichette ridondanti.

  ## Dimostrazione
  Il revisore apre la griglia viaggi con un viaggio che ha più di tre stagioni e osserva tre tag, l’indicazione degli ulteriori e icone lineari; non compare l’etichetta Pubblicato.

  ## Criteri di accettazione
  - [ ] AC-1 — La griglia non mostra l’etichetta Pubblicato.
  - [ ] AC-2 — I tag stagionali visibili sono limitati a tre con indicazione degli ulteriori.
  - [ ] AC-3 — Le icone delle stagioni usano lo stile vettoriale lineare della scheda viaggio.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-117](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-117)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  dall'elenco dei viaggi in modalità visualizzazione griglia  togliere la scritta "pubblicato" (tutti i viaggi visibili da utente sono pubblicati per definizione.
  fare stesso giochino per i tag stagionali in modo che appaiano solo 3 (+ altri ancora)
  le icone dei tag Stagioni devono essere vettoriale linea semplice come quelle usate nella scheda del viaggio
