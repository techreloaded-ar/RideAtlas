  AC
  * un viaggio in BOZZA non potrà più essere comprato da nessuno
  * il viaggio in BOZZA è ancora accessibile a chi lo ha acquistato
  * Il viaggiopotrà essere riportato in bozza sia  nella dashboard  I tuoi viaggi ) che nella pagina di Amministrazione (gestione viaggi)
