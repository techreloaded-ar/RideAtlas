body: |-
  #### US-062: Errore nel ri-acquisto di un viaggio rimborsato

  **Epic:** EP-004 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come utente rimborsato,
  voglio riacquistare lo stesso viaggio senza una pagina di errore,
  così da ottenere nuovamente accesso ai contenuti.

  ## Dimostrazione
  Con un acquisto rimborsato il revisore apre il viaggio, clicca Acquista ora e Procedi al pagamento: raggiunge il pagamento senza la pagina di errore segnalata.

  ## Criteri di accettazione
  - [ ] AC-1 — Un acquisto rimborsato rende nuovamente disponibile il comando Acquista ora.
  - [ ] AC-2 — Procedi al pagamento sul viaggio rimborsato apre il pagamento senza l’errore segnalato.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-172](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-172)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  se un viaggio viene rimborsato e l'utente accede alla pagina del viaggio rimborsato, giustamente lo vede da acquistare. Se però decido di acquistare il viaggio, clicco su Acquista Ora e poi Procedi al pagamento, ottengo una pagina di errore come nell'immagine allegata.
