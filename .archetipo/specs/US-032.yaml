  ## Testo originale Nifty
  come ranger voglio poter un sistema rapido per aggiungere più immagini al viaggio per velocizzare inserimento multimedia

  AC

  voglio poter aggiunger una immagine (opzionale più immagini contemporaneamente) al viaggio con modalità drag&drop
