body: |-
  #### US-032: drag&drop immagini viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  come ranger voglio poter un sistema rapido per aggiungere più immagini al viaggio per velocizzare inserimento multimedia

  ## Dimostrazione
  Un Ranger trascina una foto nel viaggio in modifica e la vede associata al viaggio.

  ## Criteri di accettazione
  - [ ] AC-1 — Il trascinamento di una foto la associa al viaggio in modifica.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

