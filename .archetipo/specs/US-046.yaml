body: |-
  #### US-046: #BUG - km tappa caricamento zip

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Ranger,
  voglio ottenere la distanza della tappa già all’importazione ZIP,
  così da evitare di ricaricare manualmente il GPX.

  ## Dimostrazione
  Il Ranger importa uno ZIP con una tappa e un GPX di distanza nota: la sintesi della tappa mostra i chilometri senza richiedere un secondo caricamento manuale del GPX.

  ## Criteri di accettazione
  - [ ] AC-1 — L’importazione ZIP calcola la distanza della tappa dal GPX.
  - [ ] AC-2 — La sintesi della tappa mostra la distanza senza un successivo upload manuale del GPX.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-141](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-141)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  il caricamento dello  zip, non calcola correttamente la distanza della tappa e questa poi non appare nei dati di sintesi della tappa. Il calcolo viene fatto solo se si ricarica manualmente il .gpx

  (vedi https://ride-atlas-liart.vercel.app/trips/anello-dei-passi-nascosti dove per la prima tappa il gpx è stato ricaricato gli altri no).
