body: |-
  #### US-069: Quando un ranger aggiorna la sua bio, si cancella la descrizione della moto e viceversa.

  **Epic:** EP-005 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Ranger,
  voglio salvare bio e descrizione moto senza cancellare l’altro campo,
  così da mantenere integro il profilo.

  ## Dimostrazione
  Un Ranger modifica solo la bio e salva: la descrizione della moto resta invariata. Poi modifica solo la descrizione della moto e salva: la bio resta invariata.

  ## Criteri di accettazione
  - [ ] AC-1 — Salvare solo la bio del Ranger conserva la descrizione della moto.
  - [ ] AC-2 — Salvare solo la descrizione della moto conserva la bio personale.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

