body: |-
  #### US-031: drag&drop immagini tappa

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  come ranger voglio poter un sistema rapido per aggiungere più immagini alla tappa per velocizzare inserimento multimedia viaggio.

  ## Dimostrazione
  Un Ranger trascina una foto nella tappa in modifica e la vede associata alla tappa.

  ## Criteri di accettazione
  - [ ] AC-1 — Il trascinamento di una foto la associa alla tappa in modifica.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-112](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-112)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  come ranger voglio poter un sistema rapido per aggiungere più immagini alla tappa per velocizzare inserimento multimedia viaggio.

  AC

  voglio poter aggiunger una immagine (opzionale più immagini contemporaneamente) alla tappa con modalità drag&drop
