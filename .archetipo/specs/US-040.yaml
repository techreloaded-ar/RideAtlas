  #### US-040: gestire archiviazione risorse per viaggio (compartimentazione risorse viaggio)

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come operatore,
  voglio organizzare le risorse per singolo viaggio,
  così da gestirne l’archiviazione in modo separato.

  ## Dimostrazione
  La fonte riporta solo il titolo sulla compartimentazione delle risorse del viaggio; il revisore controlla il riferimento Nifty senza presumere una struttura di storage non descritta.

