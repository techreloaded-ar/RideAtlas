body: |-
  #### US-036: nuovi campi creazione viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  in qualità di ranger voglio poter creare un viaggio inserendo la data di percorrenza (NOME ETICHETTA DA CAPIRE ANCORA, potrebbe essere "viaggio effettuato dal ranger il") per indicare quando è stato fatto il viaggio (=quando sono stati raccolti i viaggi) in modo che il motociclista possa capire se i dati sono recenti e se invece potrebbe essere cambiato qualcosa nelle strade.

  ## Dimostrazione
  Un Ranger imposta la data in cui ha percorso il viaggio, salva e verifica che la data di percorrenza sia consultabile nel viaggio.

  ## Criteri di accettazione
  - [ ] AC-1 — La creazione del viaggio permette di indicare la data della percorrenza del Ranger.
  - [ ] AC-2 — La data di percorrenza è disponibile per valutarne la recenza; l’etichetta definitiva non è specificata nella fonte.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

