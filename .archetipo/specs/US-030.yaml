body: |-
  #### US-030: Correzione visualizzazione scheda viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come editor di un viaggio,
  voglio usare una descrizione estesa e collegare video al viaggio e alle tappe,
  così da presentare i contenuti con etichette comprensibili.

  ## Dimostrazione
  Il revisore apre la scheda viaggio e osserva Descrizione al posto di Sommario, senza Approfondimenti; prova la descrizione estesa e i link video del viaggio e di una tappa.

  ## Criteri di accettazione
  - [ ] AC-1 — La scheda viaggio non espone Approfondimenti.
  - [ ] AC-2 — Il campo Sommario è etichettato Descrizione.
  - [ ] AC-3 — La descrizione supporta 6000 caratteri.
  - [ ] AC-4 — Il viaggio permette link video YouTube e Instagram.
  - [ ] AC-5 — Le singole tappe permettono link video YouTube e Instagram.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-111](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-111)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  togliere il campo Approfondimenti
  il campo "sommario" diventa "descrizione"
  lunghezza del campo descrizione è 6k char
  aggiungere ai contenuti multimediali del viaggio la possibilità di inserire lnk a video online (YouTube, Instagram)
  aggiungere ai contenuti multimediali di ogni singola tappa del viaggio la possibilità di inserire lnk a video online (YouTube, Instagram)
