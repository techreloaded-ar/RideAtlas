  #### US-012: US 4.1.9bis Visualizzazione lista viaggi [INTEGRAZIONE per ruolo]

  **Epic:** EP-003 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Utente del sistema
  Voglio visualizzare l’elenco dei viaggi creati in base al mio ruolo
  Affinché possa consultare i viaggi in funzione dello scopo del mio ruolo

  ## Dimostrazione
  Con due viaggi, uno pubblicato e uno in bozza, il revisore apre l’elenco come admin, Ranger ed Explorer e confronta i risultati ammessi per ciascun ruolo.

  ## Criteri di accettazione
  - [ ] AC-1 — Admin e Ranger vedono i viaggi pubblicati.
  - [ ] AC-2 — Admin e Ranger vedono i viaggi in bozza.
  - [ ] AC-3 — L’Explorer vede esclusivamente i viaggi pubblicati.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

