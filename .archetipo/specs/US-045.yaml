  #### US-045: #BUGFIX: visualizzazione dati viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Ranger,
  voglio vedere la durata come sottotitolo della tappa anche in modifica,
  così da ritrovare le stesse informazioni della vista di consultazione.

  ## Dimostrazione
  Il revisore apre la stessa tappa in modifica e in visualizzazione: in entrambi i casi il sottotitolo mostra la durata.

  ## Criteri di accettazione
  - [ ] AC-1 — Il sottotitolo della tappa in modifica mostra la durata come nella visualizzazione.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

