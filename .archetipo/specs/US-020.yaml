  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  in qualità di utente ranger/admin
  nel menu principale a sx, alla voce "pacchetti"
  vorrei accedere solo ai viaggi pubblicati
  affinché non confonda il menu a sx (navigazione) con quello a dx (funzionalità operativa)

  AC

  cliccando sul menu pacchetti vedo solo i viaggi pubblicati.
  l'elenco mostrato non permette modifiche ai viaggi (opzionale)
  la voce "pacchetti" deve diventare "i viaggi" descritto nella US 4.1.10_2
