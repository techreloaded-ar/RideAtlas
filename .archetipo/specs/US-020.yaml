body: |-
  #### US-020: US 4.1.10 - visualizza pacchetti viaggio

  **Epic:** EP-003 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  in qualità di utente ranger/admin
  nel menu principale a sx, alla voce "pacchetti"
  vorrei accedere solo ai viaggi pubblicati
  affinché non confonda il menu a sx (navigazione) con quello a dx (funzionalità operativa)

  ## Dimostrazione
  Un Ranger apre la voce di navigazione I viaggi e vede esclusivamente i viaggi pubblicati.

  ## Criteri di accettazione
  - [ ] AC-1 — La voce di navigazione dei viaggi mostra esclusivamente viaggi pubblicati.
  - [ ] AC-2 — La voce Pacchetti è rinominata I viaggi.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

