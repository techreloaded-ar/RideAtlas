  #### US-057: 5. Sicurezza dei dati e accesso

  **Epic:** EP-007 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come utente,
  voglio accedere al sito tramite HTTPS,
  così da usare una connessione cifrata.

  ## Dimostrazione
  Il revisore percorre le pagine del sito e verifica che gli indirizzi utilizzino HTTPS.

  ## Criteri di accettazione
  - [ ] AC-1 — Le pagine del sito sono servite tramite HTTPS.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

