  #### US-025: US 1.3.2 - Download GPX solo per iscritti

  **Epic:** EP-004 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come proprietario del sistema
  In modo da valorizzare i contenuti
  Vorrei che i GPX possano essere scaricati solo da utenti registrati

  ## Dimostrazione
  Un visitatore apre un viaggio con GPX e non può scaricare la traccia; lo stesso controllo con un utente registrato rende disponibile il download previsto dalla storia storica.

  ## Criteri di accettazione
  - [ ] AC-1 — Un visitatore non registrato non può scaricare il GPX.
  - [ ] AC-2 — Un utente registrato accede al download nel perimetro storico della scheda.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

