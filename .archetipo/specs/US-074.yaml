  #### US-074: privacy policy

  **Epic:** EP-007 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come utente,
  voglio trovare il recapito email aggiornato nella privacy policy,
  così da usare il contatto previsto dall’informativa.

  ## Dimostrazione
  Il revisore apre la privacy policy e controlla l’aggiornamento del recapito email richiesto dalla scheda. Il nuovo indirizzo non è indicato nella descrizione originale.

  ## Criteri di accettazione
  - [ ] AC-1 — La richiesta storica riguarda il recapito email nella privacy policy; la descrizione non indica il nuovo indirizzo.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

