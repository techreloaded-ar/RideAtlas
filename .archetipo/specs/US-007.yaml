body: |-
  #### US-007: US 4.2.1 - Modifica Viaggio: Informazioni Base

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Ranger
  Voglio modificare le informazioni base di un viaggio
  Affinché possa aggiornare i dati preliminari

  ## Dimostrazione
  Il Ranger autore apre un viaggio, aggiorna titolo e zona, conferma e verifica i nuovi valori nel dettaglio e nella lista. Un altro Ranger non trova la possibilità di modificarlo.

  ## Criteri di accettazione
  - [ ] AC-1 — La modifica permette di aggiornare titolo, descrizione, zona, hashtag, stagione e caratteristiche.
  - [ ] AC-2 — Le modifiche persistono solo dopo la conferma.
  - [ ] AC-3 — Il Ranger creatore può modificare il viaggio.
  - [ ] AC-4 — Un admin può modificare il viaggio.
  - [ ] AC-5 — Un Ranger diverso dal creatore non può modificare il viaggio.
  - [ ] AC-6 — Dopo il salvataggio il dettaglio mostra i valori aggiornati.
  - [ ] AC-7 — La lista mostra i valori aggiornati dei campi presenti nella lista.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

