  ## Testo originale Nifty
  Come Ranger
  Voglio modificare le informazioni base di un viaggio
  Affinché possa aggiornare i dati preliminari

  AC:

  Posso modificare tutti i campi della creazione (titolo, descrizione, zona, hashtag, stagione, caratteristiche)
  Le modifiche vengono salvate solo dopo conferma
  Solo il ranger creatore o un admin possono modificare
  Dopo il salvataggio devo poter vedere le modifiche sia nella visualizzazione del viaggio singolo che nell'elenco dei viaggi (se la modifica è fra i campi visualizzati nella visualizzazione elenco viaggi)
