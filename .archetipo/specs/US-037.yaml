body: |-
  #### US-037: Cancellazione definitiva del viaggio

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  come admin voglio poter eliminare definitivamente un viaggio e le sue risorse (media e gpx)  affinché possa liberare spazio sul disco

  ## Dimostrazione
  In un ambiente di prova un admin elimina definitivamente un viaggio di esempio con media e GPX e verifica l’assenza del viaggio e delle sue risorse.

  ## Criteri di accettazione
  - [ ] AC-1 — L’admin può eliminare definitivamente un viaggio.
  - [ ] AC-2 — L’eliminazione rimuove i media associati.
  - [ ] AC-3 — L’eliminazione rimuove i GPX associati.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

