body: |-
  #### US-005: US 1.3.1 — CAMBIO PASSWORD

  **Epic:** EP-001 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  In qualità di utente voglio poter cambiare la password affinché possa rendere più sicuro il mio account

  ## Dimostrazione
  Un utente con password apre il profilo e cambia le credenziali. Un utente OAuth apre lo stesso profilo e non trova la funzione di cambio password.

  ## Criteri di accettazione
  - [ ] AC-1 — Un utente con credenziali locali può cambiarle dal profilo.
  - [ ] AC-2 — Un utente autenticato tramite OAuth non dispone della funzione di cambio password nel perimetro storico.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

