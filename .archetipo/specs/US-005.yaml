  - La richiesta descrive una fase storica; terminologia dei ruoli, provider, accessi e disponibilità possono differire dai requisiti successivi. Non è una modifica al contratto applicativo attuale.

  ## Testo originale Nifty
  In qualità di utente voglio poter cambiare la password affinché possa rendere più sicuro il mio account

  Criteri di accettazione:

  L’utente può modificare le credenziali dal proprio profilo.
  Se l'utente è collegato tramite autenticazione OAuth (Google, Apple...), la funzionalità non deve essere disponibile
