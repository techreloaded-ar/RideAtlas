body: |-
  #### US-004: US 1.2 - Login/Registrazione con email

  **Epic:** EP-001 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  In qualità di utente voglio registrarmi usando solo la mail affinché possa utilizzare un metodo classico e semplice.

  ## Dimostrazione
  Un visitatore si registra con email e password, riceve la conferma email e prova ad accedere prima e dopo la verifica: l’accesso è disponibile solo dopo la verifica.

  ## Criteri di accettazione
  - [ ] AC-1 — Il modulo di registrazione accetta email e password.
  - [ ] AC-2 — La registrazione recapita un’email di conferma.
  - [ ] AC-3 — Un account senza verifica email non può effettuare il login.
  - [ ] AC-4 — Dopo la verifica email l’account può effettuare il login.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

