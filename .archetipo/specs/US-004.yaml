  ## Testo originale Nifty
  In qualità di utente voglio registrarmi usando solo la mail affinché possa utilizzare un metodo classico e semplice.

  Criteri di accettazione:

  Il form di registrazione permette email e password.
  Dopo la registrazione l’utente riceve un’email di conferma.
  Il login avviene solo dopo verifica email.
