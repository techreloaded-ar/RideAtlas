body: |-
  #### US-022: US 1.3 — LOGIN CON USERID E PASSWORD (pt 1)

  **Epic:** EP-001 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  In qualità di utente voglio creare un account con userid e password affinché possa avere un accesso tradizionale sicuro.

  ## Dimostrazione
  Un visitatore compila la creazione account con userid e password: una password di sette caratteri non soddisfa il criterio; una di almeno otto con maiuscola, minuscola e numero lo soddisfa.

  ## Criteri di accettazione
  - [ ] AC-1 — La creazione account richiede userid.
  - [ ] AC-2 — La creazione account richiede password.
  - [ ] AC-3 — La password richiede almeno otto caratteri.
  - [ ] AC-4 — La password richiede almeno una maiuscola.
  - [ ] AC-5 — La password richiede almeno una minuscola.
  - [ ] AC-6 — La password richiede almeno un numero.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

  ## Provenienza
  - Fonte: [SBI-92](https://agilereloaded.nifty.pm/Lk!HPsQBFT6LGV/task/SBI-92)
  - Stato originale: Completed.
  - Release originale: Release 1.0.
  - Importazione: 15 ottobre 2026.
  - Priorità MEDIUM usata come valore neutro di importazione; punti 1 è il minimo tecnico richiesto dal validatore ARchetipo; non è una stima storica né una misura del lavoro svolto.

  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  In qualità di utente voglio creare un account con userid e password affinché possa avere un accesso tradizionale sicuro.

  Criteri di accettazione:

  Username e password sono obbligatori al momento della creazione.
  La password deve contenere almeno 8 caratteri, una maiuscola, una minuscola e un numero.
