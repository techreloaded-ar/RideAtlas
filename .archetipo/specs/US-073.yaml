  #### US-073: scelta login google

  **Epic:** EP-001 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  come utente del sistema vorrei poter scegliere con quale utente google  affinché possa entrare con diversi profili.

  ## Dimostrazione
  Un utente sceglie Accedi con Google e vede il selettore account prima di completare l’autenticazione con il profilo desiderato.

  ## Criteri di accettazione
  - [ ] AC-1 — Accedi con Google presenta la scelta dell’account Google.
  - [ ] AC-2 — L’utente può completare l’accesso con il profilo scelto.

