  ## Storia utente
  Come Sentinel Vorrei pubblicare i viaggi in modo da renderli disponibili agli altri utenti

  Come Sentinel
  Voglio pubblicare un viaggio
  Affinché diventi disponibile agli altri utenti

  ## Dimostrazione
  Un Sentinel apre un viaggio in bozza e usa la pubblicazione: lo stato diventa pubblicato.

  ## Criteri di accettazione
  - [ ] AC-1 — Il Sentinel può portare un viaggio da bozza a pubblicato.

