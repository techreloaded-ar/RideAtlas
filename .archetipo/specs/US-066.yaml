  #### US-066: assegna viaggi a Mike

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come amministratore,
  voglio assegnare a Mike i viaggi indicati escluso Argentario,
  così da attribuire i contenuti al Ranger previsto.

  ## Dimostrazione
  Con i viaggi storici di riferimento il revisore verifica l’attribuzione a Mike e controlla che il viaggio in Argentario rimanga escluso.

  ## Criteri di accettazione
  - [ ] AC-1 — I viaggi storici oggetto dell’operazione sono assegnati a Mike.
  - [ ] AC-2 — Il viaggio in Argentario è escluso dalla riassegnazione.

