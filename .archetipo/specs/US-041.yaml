  #### US-041: #BUGFIX: link post upload

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come Ranger,
  voglio raggiungere la console dei miei viaggi al termine dell’upload ZIP,
  così da ritrovare il viaggio importato.

  ## Dimostrazione
  Al termine dell’importazione ZIP il revisore clicca Vai ai tuoi viaggi e raggiunge la console dei propri viaggi.

  ## Criteri di accettazione
  - [ ] AC-1 — Dopo l’upload ZIP il collegamento Vai ai tuoi viaggi apre la console dei viaggi dell’utente.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

