body: |-
  #### US-009: US 4.6.1 - Caricamento Contenuti Multimediali

  **Epic:** EP-002 | **Priorità:** MEDIUM | **Punti:** 1 | **Stato:** DONE
  **Bloccata da:** -

  ## Storia utente
  Come editor di un viaggio
  Voglio caricare contenuti multimediali nel viaggio
  Affinché gli utenti abbiano materiali utili per valutare se il viaggio è di loro interesse.

  ## Dimostrazione
  L’editor apre un viaggio, aggiunge testo con un link, foto JPG e PNG con didascalia e collegamenti YouTube; apre la visualizzazione e ritrova i contenuti nella gabbia prevista.

  ## Criteri di accettazione
  - [ ] AC-1 — Il viaggio permette l’inserimento di testo esteso con link navigabili.
  - [ ] AC-2 — Il viaggio permette foto JPG e PNG.
  - [ ] AC-3 — Il viaggio permette collegamenti a video YouTube.
  - [ ] AC-4 — Gli elementi visuali possono avere una didascalia.
  - [ ] AC-5 — La visualizzazione usa la gabbia fissa descritta nella fonte: testo a tutta larghezza, tre colonne immagini e due righe video.

  ## Fuori perimetro
  Nuovo sviluppo, ampliamenti non presenti nella scheda, nuova accettazione del prodotto e recupero dei documenti o degli allegati esterni. La scheda conserva il perimetro della versione storica.

