  ## Note di importazione
  - Importazione retrospettiva da Nifty: stato originale Completed, stato ARchetipo DONE. Non sono state eseguite nuove verifiche funzionali; le caselle dei criteri restano non spuntate.
  - Dimostrazione e criteri normalizzati servono alla lettura dello storico e non costituiscono un nuovo piano di sviluppo.

  ## Testo originale Nifty
  Come editor di un viaggio
  Voglio caricare contenuti multimediali nel viaggio
  Affinché gli utenti abbiano materiali utili per valutare se il viaggio è di loro interesse.

  AC:

  utente può aggiungere testo esteso che racconti fatti, luoghi e approfondimenti.
  utente può caricare foto (JPG, PNG), link a video pubblicati su YouTube.
  Per ogni elemento visuale si può aggiungere una didascalia
  utente può inserire i contenuti in un form di inserimento che sarà poi quello usato per la visualizzazione. non ci preoccupiamo della gestione della gabbia grafica che è unica e non modificabile.
  La gabbia prevede nella prima riga 1 campo testo a tutta larghezza (opzionale il testo deve poter contenere link navigabili); nella seconda riga 3 colonne per inserimento elementi grafici (immagini); nella terza e quarta riga un  paio di video che saranno inseriti come link a YouTube.
